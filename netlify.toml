[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/free-audit"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/business-audit"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/revenue-leak-scorecard"
to = "/pipeline-recovery-review"
status = 301
force = true

[[redirects]]
from = "/brisbane"
to = "/construction-ai-brisbane"
status = 301
force = true

[[redirects]]
from = "/newcastle"
to = "/construction-ai-newcastle"
status = 301
force = true

[[redirects]]
from = "/osr"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/operations-review"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/services"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/software"
to = "/clarity-blueprint"
status = 301
force = true

[[redirects]]
from = "/lead-generation"
to = "/enquiry-automation"
status = 301
force = true

# All blog posts live in the codebase and are prerendered, so an unknown /blog/ address is a real 404.
# (If Supabase-hosted posts are ever restored, re-add a /blog/* rule pointing at /app.html with status 200.)

# Everything else that is not a real file is a genuine 404 (not a soft 404 with status 200).
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpg"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=3600"
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/llms.txt"

[headers.values]
Cache-Control = "public, max-age=3600"
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=3600"
Content-Type = "text/plain; charset=utf-8"

[[plugins]]
package = "@netlify/plugin-lighthouse"